server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js loads its worker via dynamic import.  Make the module MIME type
    # explicit instead of relying on the base image's mime.types revision.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 420s;
        proxy_buffering off;
    }

    # PDF files
    location /library/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
